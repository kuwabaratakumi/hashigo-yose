<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>しびれろ！はしご寄席</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="東京・横浜・大阪・神戸の寄席の番組を10日間分まとめて見て、推しの芸人さんを追いかけるはしごの組み合わせを探す">
<meta name="theme-color" content="#1f1a17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top__inner">
    <h1 class="brand"><svg class="brand__icon" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="brandMask"><rect width="100" height="100" fill="#fff"/><g fill="#000"><rect x="11.7" y="0" width="10" height="100"/><rect x="78.3" y="0" width="10" height="100"/><rect x="21.7" y="23.75" width="56.6" height="10"/><rect x="21.7" y="66.25" width="56.6" height="10"/></g></mask></defs><circle cx="50" cy="50" r="50" fill="currentColor" mask="url(#brandMask)"/></svg>しびれろ！はしご寄席</h1>
    <button class="pick-btn" id="openPicker" type="button">寄席を選ぶ <span id="pickCount" class="pick-btn__n">0</span></button>
  </div>
  <nav class="days" id="days" aria-label="日付"></nav>
  <div class="tools">
    <div class="view" role="radiogroup" aria-label="表示">
      <button type="button" data-view="hashigo" aria-pressed="false">はしごする</button>
      <button type="button" data-view="bangumi" aria-pressed="true">番組</button>
      <button type="button" data-view="geinin">芸人さがし</button>
    </div>
    <label class="search">
      <span class="visually-hidden">芸人さんの名前で絞り込む</span>
      <input id="q" type="search" placeholder="芸人さんの名前で絞り込む（例: 喬太郎）" autocomplete="off" list="nameList">
    </label>
  </div>
</header>

<section id="hashigo" class="hashigo" hidden>
  <form class="hashigo__form" id="hashigoForm" autocomplete="off">
    <fieldset class="hashigo__titles">
      <legend>この日に観たい芸人さんを2人以上入れてください</legend>
      <div class="hashigo__picks" id="picks">
        <input type="search" name="n" list="nameList" placeholder="芸人さんの名前（例: 一之輔）" aria-label="1人目">
        <input type="search" name="n" list="nameList" placeholder="芸人さんの名前" aria-label="2人目">
        <input type="search" name="n" list="nameList" placeholder="3人目（任意）" aria-label="3人目">
        <input type="search" name="n" list="nameList" placeholder="4人目（任意）" aria-label="4人目">
      </div>
    </fieldset>
    <div class="hashigo__opts">
      <span class="hashigo__scope" role="radiogroup" aria-label="探す範囲">
        <label><input type="radio" name="scope" value="selected" checked> 選んだ寄席</label>
        <label><input type="radio" name="scope" value="all"> すべての寄席</label>
      </span>
    </div>
  </form>
</section>

<datalist id="nameList"></datalist>
<main id="main" class="main"></main>

<footer class="foot">
  <p id="updated"></p>
  <p>番組は各寄席の公式サイトを参照しています。出演者は急に変わることがあります（代演・休演）。<br>お出かけ前に公式サイトをご確認ください。高座の時刻は番組表から出した目安です。</p>
  <p>運営：OCOSCO LLC.<br><a class="foot__link" href="about.html">当サイトについて</a></p>
</footer>

<dialog id="picker" class="picker">
  <form method="dialog" class="picker__form">
    <div class="picker__head">
      <h2>寄席を選ぶ</h2>
      <button class="picker__close" value="close" aria-label="閉じる">閉じる</button>
    </div>
    <div id="pickerList" class="picker__list"></div>
    <div class="picker__foot">
      <button type="button" id="clearPick" class="ghost">選択をすべて外す</button>
      <button value="ok" class="primary">この寄席で表示</button>
    </div>
  </form>
</dialog>

<template id="tplEmpty">
  <section class="empty">
    <p class="empty__lead">見たい寄席を選んでください。</p>
    <p>選んだ寄席は次に開いたときも残ります。</p>
    <button type="button" class="primary" data-open-picker>寄席を選ぶ</button>
  </section>
</template>

<script src="app.js" type="module"></script>
</body>
</html>
